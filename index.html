<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mac.hm</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url("./arch.jpg") center center / cover no-repeat fixed;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .logo img {
      display: block;
      width: min(300px, 60vw);
      height: auto;
    }

    .contact {
      font-family: "Burbank Big Black", Inter, system-ui, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 16px;
      color: #cfcfcf;
      text-align: center;
      margin-top: 20px;
      letter-spacing: 0.6px;
    }

    .contact a {
      color: #ffffff;
      text-decoration: underline;
      text-decoration-thickness: 1px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="logo">
      <img src="./pax.png" alt="pax" />
    </h1>

    <div class="contact">
      <a href="mailto:pax@mac.hm">pax@mac.hm</a>
    </div>
  </div>
</body>
</html>
